<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Yulu Nicaragua</title>
  <link rel="stylesheet" href="../Css/reservas.css">
</head>
<body>
  <header>
    <h1>Reservar Tour</h1>
  </header>

  <main>
    <form id="formReserva">
      <label for="sitio">Sitio Turístico</label>
      <select id="sitio" name="sitio" required></select>

      <label for="guia">Guía</label>
      <select id="guia" name="guia" required></select>

      <label for="fecha_reserva">Fecha Reserva</label>
      <input type="date" id="fecha_reserva" name="fecha_reserva" required>

      <label for="hora_inicio">Hora Inicio</label>
      <input type="time" id="hora_inicio" name="hora_inicio" required>

      <label for="duracion_horas">Duración (horas)</label>
      <input type="number" id="duracion_horas" name="duracion_horas" required>

      <label for="numero_personas">Número de personas</label>
      <input type="number" id="numero_personas" name="numero_personas" required>

      <label for="metodo_pago">Método de pago</label>
      <select id="metodo_pago" name="metodo_pago" required>
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta">Tarjeta</option>
      </select>

      <label for="requisitos_especiales">Requisitos especiales</label>
      <textarea id="requisitos_especiales" name="requisitos_especiales"></textarea>

      <label for="punto_encuentro">Punto de encuentro</label>
      <input type="text" id="punto_encuentro" name="punto_encuentro">

      <button type="submit">Reservar</button>
    </form>
  </main>

  <script src="../JS/reservas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Yulu Nicaragua</title>
  <link rel="stylesheet" href="../Css/reservas.css">

</head>
<body>
  <header>
    <h1>Reservar Tour</h1>
    <p>Vive la experiencia única de Nicaragua con nuestros guías certificados</p>
  </header>

  <main>
    <form id="formReserva">
      <!-- Información del Tour -->
      <div class="form-grid">
        <div class="form-group">
          <label for="sitio">Sitio Turístico</label>
          <select id="sitio" name="sitio" required>
            <option value="">Selecciona un destino</option>
          </select>
        </div>

        <div class="form-group">
          <label for="guia">Guía Especializado</label>
          <select id="guia" name="guia" required>
            <option value="">Elige tu guía</option>
          </select>
        </div>
      </div>

      <!-- Fecha y Hora -->
      <div class="form-grid">
        <div class="form-group">
          <label for="fecha_reserva">Fecha del Tour</label>
          <input type="date" id="fecha_reserva" name="fecha_reserva" required>
        </div>

        <div class="form-group datetime-group">
          <div>
            <label for="hora_inicio">Hora de Inicio</label>
            <input type="time" id="hora_inicio" name="hora_inicio" required>
          </div>
          <div>
            <label for="duracion_horas">Duración (horas)</label>
            <input type="number" id="duracion_horas" name="duracion_horas" min="1" max="12" value="4" required>
          </div>
        </div>
      </div>

      <!-- Información del Grupo -->
      <div class="form-grid">
        <div class="form-group">
          <label for="numero_personas">Número de personas</label>
          <input type="number" id="numero_personas" name="numero_personas" min="1" max="20" value="1" required>
        </div>

        <div class="form-group">
          <label for="metodo_pago">Método de pago</label>
          <select id="metodo_pago" name="metodo_pago" required>
            <option value="efectivo">💵 Efectivo</option>
            <option value="tarjeta">💳 Tarjeta Crédito/Débito</option>
            <option value="transferencia">🏦 Transferencia Bancaria</option>
          </select>
        </div>
      </div>

      <!-- Información de Precio Dinámico -->
      <div class="price-info">
        <div class="price-display">
          <span class="price-label">Precio estimado:</span>
          <span class="price-amount" id="precioEstimado">$0.00</span>
        </div>
        <div class="price-note">* El precio final puede variar según servicios adicionales</div>
      </div>

      <!-- Información Adicional -->
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="punto_encuentro">📍 Punto de encuentro</label>
          <input type="text" id="punto_encuentro" name="punto_encuentro" placeholder="Ej: Parque Central de Granada">
        </div>

        <div class="form-group full-width">
          <label for="requisitos_especiales">🎯 Requisitos especiales</label>
          <textarea id="requisitos_especiales" name="requisitos_especiales" placeholder="Alergias alimenticias, movilidad reducida, preferencias específicas..."></textarea>
        </div>
      </div>

      <!-- Botón de Reserva -->
      <div class="submit-container">
        <button type="submit" class="reserve-btn">
          <span class="btn-text">Confirmar Reserva</span>
        </button>
      </div>
    </form>
  </main>

  <script src="../JS/reservas.js"></script>
</body>
</html>
